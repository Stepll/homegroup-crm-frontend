<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="innerCircle">
      <circle cx="100" cy="100" r="82"/>
    </clipPath>
  </defs>

  <!-- Outer teal circle -->
  <circle cx="100" cy="100" r="100" fill="#2AAFCA"/>
  <!-- White inner circle -->
  <circle cx="100" cy="100" r="82" fill="#FFFFFF"/>

  <g clip-path="url(#innerCircle)">
    <!-- Cross at top -->
    <rect x="96" y="22" width="8" height="24" rx="1.5" fill="#2AAFCA"/>
    <rect x="86" y="28" width="28" height="8" rx="1.5" fill="#2AAFCA"/>

    <!-- Main church silhouette: spire + sloped shoulders + side towers -->
    <path fill="#2AAFCA" d="
      M 100 46
      L 87 70
      L 87 92
      L 48 104
      L 48 174
      L 152 174
      L 152 104
      L 113 92
      L 113 70
      Z
    "/>

    <!-- Left stained glass window (rhombus with cross panes) -->
    <polygon points="70,118 53,138 70,158 87,138" fill="#FFFFFF"/>
    <line x1="70" y1="118" x2="70" y2="158" stroke="#2AAFCA" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="53" y1="138" x2="87" y2="138" stroke="#2AAFCA" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right stained glass window -->
    <polygon points="130,118 113,138 130,158 147,138" fill="#FFFFFF"/>
    <line x1="130" y1="118" x2="130" y2="158" stroke="#2AAFCA" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="113" y1="138" x2="147" y2="138" stroke="#2AAFCA" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
